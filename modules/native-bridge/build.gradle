plugins { id 'application' }
group = 'dev.allforvulkan'
version = rootProject.version
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories { mavenCentral() }
dependencies {
    implementation project(':core-api')
    ['lwjgl', 'lwjgl-egl', 'lwjgl-opengl', 'lwjgl-vulkan', 'lwjgl-glfw'].each {
        implementation "org.lwjgl:${it}:3.3.3"
    }
    runtimeOnly 'org.lwjgl:lwjgl:3.3.3:natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-opengl:3.3.3:natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-glfw:3.3.3:natives-linux'
}
application { mainClass = 'dev.allforvulkan.bridge.ZinkProbe' }
tasks.named('run', JavaExec) {
    systemProperty 'org.lwjgl.system.stackSize', '1024'
    systemProperty 'afv.experimentalDirectOutput', System.getProperty('afv.experimentalDirectOutput', 'false')
    // These variables affect this probe subprocess only, never the game or shell.
    environment 'MESA_LOADER_DRIVER_OVERRIDE', 'zink'
    environment 'GALLIUM_DRIVER', 'zink'
    environment '__EGL_VENDOR_LIBRARY_FILENAMES', providers.gradleProperty('mesaEglVendor').getOrElse('/usr/share/glvnd/egl_vendor.d/50_mesa.json')
}
tasks.register('verifyPresentationSurface', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.allforvulkan.bridge.PresentationSurfaceChecks'
}
tasks.named('check') { dependsOn 'verifyPresentationSurface' }
tasks.register('verifyQueueSelection', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.allforvulkan.bridge.QueueSelectionChecks'
}
tasks.named('check') { dependsOn 'verifyQueueSelection' }
tasks.register('verifyPresentDispatch', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.allforvulkan.bridge.FramePresentDispatcherChecks'
}
tasks.named('check') { dependsOn 'verifyPresentDispatch' }
tasks.register('verifyFrameGraph', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.allforvulkan.framegraph.FrameGraphChecks'
}
tasks.register('verifyCompositeChain', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.allforvulkan.framegraph.CompositeChainChecks'
    systemProperty 'org.lwjgl.system.stackSize', '1024'
    systemProperty 'afv.requireCompositeDevice', System.getProperty('afv.requireCompositeDevice', 'false')
    systemProperty 'afv.compositeDevice', System.getProperty('afv.compositeDevice', '')
    // Leave VK_ICD_FILENAMES to the machine. Forcing lavapipe here would hide the owner's GPU.
}
tasks.named('check') { dependsOn 'verifyFrameGraph', 'verifyCompositeChain' }
tasks.register('verifyIrisPackPlan', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.allforvulkan.framegraph.IrisPackPlanChecks'
}
tasks.named('check') { dependsOn 'verifyIrisPackPlan' }

// Optional direct-output router; other platforms retain the ordinary copy path.
if (System.getProperty('os.name').toLowerCase().contains('linux') &&
        System.getProperty('os.arch') in ['amd64', 'x86_64']) {
    def nativeOutput = layout.buildDirectory.dir('generated/direct-output')
    def nativeLibrary = nativeOutput.map { it.file('dev/allforvulkan/bridge/native/linux-x86_64/libafv_framebuffer.so') }
    def nativeJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def compileDirectOutput = tasks.register('compileDirectOutput', Exec) {
        inputs.file 'src/main/c/direct_framebuffer.c'
        outputs.file nativeLibrary
        doFirst {
            def output = nativeLibrary.get().asFile
            output.parentFile.mkdirs()
            def jdk = nativeJava.get().metadata.installationPath.asFile
            commandLine 'cc', '-std=c11', '-O2', '-fPIC', '-shared', '-Wall', '-Wextra', '-Werror',
                    '-I' + jdk + '/include', '-I' + jdk + '/include/linux',
                    'src/main/c/direct_framebuffer.c', '-o', output.absolutePath
        }
    }
    def nativeChecks = layout.buildDirectory.file('native-checks/direct-framebuffer-checks')
    def compileDirectOutputChecks = tasks.register('compileDirectOutputChecks', Exec) {
        inputs.files 'src/main/c/direct_framebuffer.c', 'src/test/c/direct_framebuffer_checks.c'
        outputs.file nativeChecks
        doFirst {
            def output = nativeChecks.get().asFile
            output.parentFile.mkdirs()
            def jdk = nativeJava.get().metadata.installationPath.asFile
            commandLine 'cc', '-std=c11', '-O2', '-Wall', '-Wextra', '-Werror',
                    '-I' + jdk + '/include', '-I' + jdk + '/include/linux',
                    'src/test/c/direct_framebuffer_checks.c', '-o', output.absolutePath
        }
    }
    tasks.register('verifyDirectOutputDispatch', Exec) {
        dependsOn compileDirectOutputChecks
        doFirst { commandLine nativeChecks.get().asFile.absolutePath }
    }
    tasks.named('check') { dependsOn 'verifyDirectOutputDispatch' }
    sourceSets.main.resources.srcDir nativeOutput
    tasks.named('processResources') { dependsOn compileDirectOutput }
}
