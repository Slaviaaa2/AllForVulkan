plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
evaluationDependsOn(':core-api')
evaluationDependsOn(':native-bridge')
sourceSets.main.java.srcDir 'platform/neoforge/src/main/java'
sourceSets { baseline }
sourceSets.main.java.srcDir 'validation/common/java'
sourceSets.baseline.java.srcDir 'validation/common/java'
def clientDirectory = providers.gradleProperty('afvGameDir').map { file(it) }.getOrElse(file('run'))
repositories { mavenCentral() }
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.baseline
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'
    runs {
        irisZinkBaseline {
            client()
            sourceSet = sourceSets.baseline
            gameDirectory = file('run-iris-baseline')
            systemProperty 'afv.expectZink', 'true'
            systemProperty 'org.lwjgl.opengl.explicitInit', 'true'
            systemProperty 'afv.benchmarkTicks', System.getProperty('afv.benchmarkTicks', '0')
            environment 'MESA_LOADER_DRIVER_OVERRIDE', 'zink'
            environment 'GALLIUM_DRIVER', 'zink'
            environment '__EGL_VENDOR_LIBRARY_FILENAMES', providers.gradleProperty('mesaEglVendor').getOrElse('/usr/share/glvnd/egl_vendor.d/50_mesa.json')
            if (providers.gradleProperty('zinkX11NoModifiers').getOrElse('false').toBoolean())
                environment 'LIBGL_KOPPER_DRI2', 'true'
        }
        irisBaseline {
            client()
            sourceSet = sourceSets.baseline
            gameDirectory = file('run-iris-baseline')
            systemProperty 'afv.benchmarkTicks', System.getProperty('afv.benchmarkTicks', '0')
        }
        client {
            client()
            gameDirectory = clientDirectory
            jvmArgument '-Xmx' + providers.gradleProperty('afvClientHeap').getOrElse('4G')
            systemProperty 'afv.smokeTest', System.getProperty('afv.smokeTest', 'false')
            systemProperty 'afv.smokeWorld', System.getProperty('afv.smokeWorld', 'false')
            systemProperty 'afv.smokeInspectTicks', System.getProperty('afv.smokeInspectTicks', '0')
            systemProperty 'afv.smokeSettings', System.getProperty('afv.smokeSettings', 'false')
            systemProperty 'afv.smokeIris', System.getProperty('afv.smokeIris', 'false')
            systemProperty 'afv.shadowProbe', System.getProperty('afv.shadowProbe', 'false')
            systemProperty 'afv.irisShadow', System.getProperty('afv.irisShadow', 'false')
            systemProperty 'afv.smokeIrisCycle', System.getProperty('afv.smokeIrisCycle', 'false')
            systemProperty 'afv.smokeWindowCycle', System.getProperty('afv.smokeWindowCycle', 'false')
            systemProperty 'afv.smokeDimensions', System.getProperty('afv.smokeDimensions', 'false')
            systemProperty 'afv.smokeDimensionInspectTicks', System.getProperty('afv.smokeDimensionInspectTicks', '0')
            systemProperty 'afv.smokeScene', System.getProperty('afv.smokeScene', 'false')
            systemProperty 'afv.smokeFinalOutput', System.getProperty('afv.smokeFinalOutput', 'false')
            systemProperty 'afv.experimentalAsyncPresent', System.getProperty('afv.experimentalAsyncPresent', 'false')
            systemProperty 'afv.experimentalFramePipeline', System.getProperty('afv.experimentalFramePipeline', 'false')
            systemProperty 'afv.experimentalPipelineDepth', System.getProperty('afv.experimentalPipelineDepth', '1')
            systemProperty 'afv.experimentalDirectOutput', System.getProperty('afv.experimentalDirectOutput', 'false')
            systemProperty 'afv.directOutputLayout', System.getProperty('afv.directOutputLayout', 'attachment')
            systemProperty 'afv.debugGlClient', System.getProperty('afv.debugGlClient', 'false')
            systemProperty 'afv.validationEgl', System.getProperty('afv.validationEgl', 'false')
            systemProperty 'afv.validationPack', System.getProperty('afv.validationPack', 'false')
            systemProperty 'afv.expectZink', System.getProperty('afv.expectZink', 'false')
            systemProperty 'afv.benchmarkTicks', System.getProperty('afv.benchmarkTicks', '0')
            if (System.getProperty('afv.backend') != null) systemProperty 'afv.backend', System.getProperty('afv.backend')
            systemProperty 'afv.benchmarkWarmupTicks', System.getProperty('afv.benchmarkWarmupTicks', '900')
            if (project.hasProperty('afvVulkanLibrary')) systemProperty 'org.lwjgl.vulkan.libname', project.property('afvVulkanLibrary')
            systemProperty 'afv.zinkInterop', System.getProperty('afv.zinkInterop', 'false')
            systemProperty 'afv.zinkClient', System.getProperty('afv.zinkClient', 'false')
            if (System.getProperty('afv.presentation') != null) systemProperty 'afv.presentation', System.getProperty('afv.presentation')
            systemProperty 'afv.expectZinkClient', System.getProperty('afv.expectZinkClient', 'false')
            if (System.getProperty('afv.mesaEglVendor') != null) systemProperty 'afv.mesaEglVendor', System.getProperty('afv.mesaEglVendor')
            systemProperty 'afv.zinkEffect', System.getProperty('afv.zinkEffect', 'identity')
            if (Boolean.getBoolean('afv.zinkInterop')) {
                environment 'MESA_LOADER_DRIVER_OVERRIDE', 'zink'
                environment 'GALLIUM_DRIVER', 'zink'
                environment '__EGL_VENDOR_LIBRARY_FILENAMES', providers.gradleProperty('mesaEglVendor').getOrElse('/usr/share/glvnd/egl_vendor.d/50_mesa.json')
            }
        }
    }
    mods {
        baseline { sourceSet sourceSets.baseline }
        allforvulkan {
            sourceSet sourceSets.main
            sourceSet project(':core-api').sourceSets.main
            sourceSet project(':native-bridge').sourceSets.main
        }
    }
}
neoForge.runs.irisBaseline.loadedMods = [neoForge.mods.baseline]
neoForge.runs.irisZinkBaseline.loadedMods = [neoForge.mods.baseline]
neoForge.runs.client.loadedMods = [neoForge.mods.allforvulkan]
ext.lwjglVersion = '3.3.3'
def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostArch = System.getProperty('os.arch')
def devNatives = hostOs.contains('win') ? 'natives-windows' :
        hostOs.contains('mac') ? (hostArch == 'aarch64' ? 'natives-macos-arm64' : 'natives-macos') : 'natives-linux'
def nativeTargets = ['natives-linux', 'natives-windows', 'natives-macos', 'natives-macos-arm64']
dependencies {
    baselineImplementation "org.lwjgl:lwjgl-egl:${lwjglVersion}"
    testImplementation "org.joml:joml:1.10.5"
    testImplementation "org.lwjgl:lwjgl:${lwjglVersion}"
    testImplementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    testRuntimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${devNatives}"
    testRuntimeOnly "com.google.code.gson:gson:2.10.1"
    implementation project(':core-api')
    jarJar project(':core-api')
    implementation project(':native-bridge')
    jarJar project(':native-bridge')
    ['vulkan', 'shaderc', 'vma', 'egl'].each { module ->
        implementation "org.lwjgl:lwjgl-${module}:${lwjglVersion}"
        additionalRuntimeClasspath "org.lwjgl:lwjgl-${module}:${lwjglVersion}"
        jarJar "org.lwjgl:lwjgl-${module}:${lwjglVersion}"
    }
    ['shaderc', 'vma'].each { module ->
        runtimeOnly "org.lwjgl:lwjgl-${module}:${lwjglVersion}:${devNatives}"
        additionalRuntimeClasspath "org.lwjgl:lwjgl-${module}:${lwjglVersion}:${devNatives}"
        nativeTargets.each { classifier -> jarJar "org.lwjgl:lwjgl-${module}:${lwjglVersion}:${classifier}" }
    }
    ['natives-macos', 'natives-macos-arm64'].each { classifier ->
        jarJar "org.lwjgl:lwjgl-vulkan:${lwjglVersion}:${classifier}"
    }
}
configurations.jarJar {
    exclude group: 'org.lwjgl', module: 'lwjgl'
    exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
    exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
    exclude group: 'org.lwjgl', module: 'lwjgl-stb'
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
// A standalone helper isolates unsupported Mesa/native-driver failures from Minecraft.
def zinkProbeJar = tasks.register('zinkProbeJar', Jar) {
    dependsOn ':native-bridge:classes', ':core-api:jar'
    archiveFileName = 'zink-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('probe')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'dev.allforvulkan.bridge.ZinkProbe' }
    from project(':native-bridge').sourceSets.main.output
    from { project(':native-bridge').configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
processResources {
    from(zinkProbeJar) { into 'META-INF/afv' }
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
jar {
    from('LICENSE')
    from('NOTICE.md')
    into('LICENSES') { from('LICENSES') }
    // Classifier jars need distinct JarJar IDs. LWJGL's JPMS descriptors are
    // unsuitable for NeoForge's merged native modules; retain all other bytes.
    doLast {
        def archive = archiveFile.get().asFile
        def staging = new File(temporaryDir, 'bundle')
        delete staging
        copy { from zipTree(archive); into staging }
        def nestedDir = new File(staging, 'META-INF/jarjar')
        nestedDir.listFiles()?.findAll { it.name.startsWith('lwjgl-') && it.name.endsWith('.jar') }?.each { nested ->
            def stripped = new File(temporaryDir, "clean-${nested.name}")
            ant.zip(destfile: stripped) {
                zipfileset(src: nested) {
                    exclude(name: 'module-info.class')
                    exclude(name: 'META-INF/versions/**/module-info.class')
                }
            }
            java.nio.file.Files.move(stripped.toPath(), nested.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        def metadataFile = new File(nestedDir, 'metadata.json')
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        metadata.jars.each { entry ->
            def match = entry.path =~ /-(natives-[a-z0-9-]+)\.jar$/
            if (match) entry.identifier.artifact += "-${match[0][1]}"
        }
        metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
        delete archive
        ant.zip(destfile: archive, basedir: staging)
    }
}

// Keep this development instance's GL splash disabled before FML starts.
tasks.register('prepareAfvClient') {
    doLast {
        def configFile = new File(clientDirectory, 'config/fml.toml')
        configFile.parentFile.mkdirs()
        def content = configFile.exists() ? configFile.text : ''
        if (content =~ /(?m)^earlyWindowControl\s*=/) {
            content = content.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
        } else content += '\nearlyWindowControl = false\n'
        configFile.text = content
        if (System.getProperty('afv.smokeTest', 'false') == 'true') {
            def optionsFile = new File(clientDirectory, 'options.txt')
            def options = optionsFile.exists() ? optionsFile.text : ''
            options = options.readLines().findAll { it.trim() && !it.startsWith('onboardAccessibility:') && !it.startsWith('pauseOnLostFocus:') }.join('\n')
            optionsFile.text = options + '\nonboardAccessibility:false\npauseOnLostFocus:false\n'
        }
    }
}
tasks.named('runClient') { dependsOn 'prepareAfvClient' }

tasks.register('prepareIrisBaseline', Exec) {
    commandLine 'python3', 'scripts/prepare_iris_baseline.py'
}
tasks.named('runIrisBaseline') { dependsOn 'prepareIrisBaseline' }

tasks.named('runIrisZinkBaseline') { dependsOn 'prepareIrisBaseline' }

// Pure CPU source-layout regressions; no game session or GPU context is opened.
tasks.register('verifyTextureUpload', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.vulkanmod.gl.TextureUploadChecks'
}
tasks.named('check') { dependsOn 'verifyTextureUpload' }

tasks.register('verifyShadowImage', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.allforvulkan.validation.ShadowImageChecks'
}
tasks.named('check') { dependsOn 'verifyShadowImage' }

tasks.register('verifyProjection', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.vulkanmod.vulkan.util.ProjectionChecks'
}
tasks.named('check') { dependsOn 'verifyProjection' }
tasks.named('check') { dependsOn ':native-bridge:verifyPresentationSurface' }
tasks.named('check') { dependsOn ':native-bridge:verifyQueueSelection' }
tasks.register('verifyMesaVendors', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.allforvulkan.neoforge.MesaVendorChecks'
}
tasks.named('check') { dependsOn 'verifyMesaVendors' }
tasks.named('check') { dependsOn ':native-bridge:verifyFrameGraph' }
tasks.named('check') { dependsOn ':native-bridge:verifyCompositeChain' }
tasks.named('check') { dependsOn ':native-bridge:verifyIrisPackPlan' }
tasks.named('check') { dependsOn ':native-bridge:verifyIrisSubset' }
tasks.named('check') { dependsOn ':native-bridge:verifyIrisSubsetDraw' }
